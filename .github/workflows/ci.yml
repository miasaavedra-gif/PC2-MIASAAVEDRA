name: Verificación de Ruta Gamarra
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      - name: Pruebas unitarias
        run: node --test
      - name: Análisis estático y secretos
        run: node security.mjs
