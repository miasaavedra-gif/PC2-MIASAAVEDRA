name: Extraer cartografía de Gamarra
on: [push]
permissions:
  contents: write
jobs:
  cartografia:
    if: github.ref == 'refs/heads/cartografia-gamarra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python extraer.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add damero.json
          git commit -m 'Incorpora geometría OSM del damero con fecha y fuente'
          git push
